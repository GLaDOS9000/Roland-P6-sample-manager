[project]
name = "PyP6-Roland-P6-Sample-Manager"
version = "3.0.0"
description = "Roland AIRA P-6 Sample Manager"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
    "pedalboard",
    "tkinterdnd2",
]

[project.optional-dependencies]
test = ["pytest"]
dev  = ["pytest", "ruff", "pre-commit"]

[project.scripts]
pyp6 = "pyp6.__main__:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyp6"]
